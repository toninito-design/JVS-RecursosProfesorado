const STORE='jvs-docentes-links-v1';
const PASSWORD='Julioverneschool-GSE'; // Solo barrera visual. No es autenticación segura.
let sections=load(),current=null,admin=false,query='';
function ensureCanva(data){if(!Array.isArray(data))return data;for(const section of data){if(!Array.isArray(section.links))continue;for(const link of section.links){if(link.name==='Canva'&&!link.url)link.url='https://www.canva.com/es_es/login/'}}return data}
sections=ensureCanva(sections);
function load(){try{const saved=JSON.parse(localStorage.getItem(STORE));if(Array.isArray(saved)&&saved.every(s=>typeof s.name==='string'&&Array.isArray(s.links)))return saved;}catch(e){}return structuredClone(INITIAL)}
function save(){try{localStorage.setItem(STORE,JSON.stringify(sections));}catch(e){alert('No se han podido guardar los cambios en este navegador. Exporta una copia JSON.')}}
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}

function render(){const root=document.getElementById('app');root.replaceChildren();document.getElementById('homeBtn').classList.toggle('hidden',!current);if(current==='admin'){renderAdmin(root);return}if(current){const sec=sections.find(s=>s.id===current);if(sec){renderSection(root,sec);return}current=null}renderHome(root)}
function renderHome(root){const hero=el('div','hero'),copy=el('div');copy.innerHTML='<p class="eyebrow">Tu espacio de trabajo · JVS</p><h1>Todo lo que necesitas,<br>en un solo lugar.</h1><p class="intro">Accede de forma rápida y organizada a las plataformas, herramientas y recursos del profesorado de Julio Verne School.</p>';const total=sections.reduce((n,s)=>n+s.links.length,0),stats=el('div','stats');stats.innerHTML='<strong>'+total+'</strong> recursos · '+sections.length+' secciones';hero.append(copy,stats);root.append(hero);const grid=el('div','section-grid');sections.forEach(s=>{const b=el('button','tile');b.type='button';const icon=el('span','icon-circle');icon.innerHTML=svg(s.icon);b.append(icon,el('span','tile-title',s.name));const bottom=el('span','tile-bottom');bottom.append(el('span','pill',s.links.length+' enlaces'),el('span','tile-arrow','↗'));b.append(bottom);b.onclick=()=>{current=s.id;query='';render();window.scrollTo(0,0)};grid.append(b)});root.append(grid)}
function renderSection(root,sec){const back=el('button','back','← Volver a todas las secciones');back.onclick=()=>{current=null;render()};root.append(back);const head=el('div','subhead'),left=el('div');left.append(el('p','eyebrow','Repositorio docente'),el('h2','',sec.name),el('p','',sec.links.length+' recursos disponibles'));const search=el('input','search');search.placeholder='Buscar en esta sección…';search.type='search';search.setAttribute('aria-label','Buscar recursos');search.value=query;head.append(left,search);root.append(head);const grid=el('div','links-grid');root.append(grid);function fill(){grid.replaceChildren();const found=sec.links.filter(l=>l.name.toLocaleLowerCase('es').includes(query.toLocaleLowerCase('es')));if(!found.length){grid.append(el('div','empty','No se encontraron recursos con ese nombre.'));return}found.forEach(l=>{const valid=/^https:\/\//i.test(l.url);const a=el(valid?'a':'div','link-card'+(valid?'':' disabled'));if(valid){a.href=l.url;a.target='_blank';a.rel='noopener noreferrer';a.title='Abrir '+l.name+' en otra pestaña'}else a.title='Enlace pendiente de configurar';const ico=el('span','link-icon');ico.innerHTML=svg('link');a.append(ico);const txt=el('div');txt.append(el('div','link-text',l.name));if(!valid)txt.append(el('div','muted','Pendiente de enlace'));a.append(txt);if(valid)a.append(el('span','external','↗'));grid.append(a)})}search.oninput=()=>{query=search.value;fill()};fill()}
function renderAdmin(root){const back=el('button','back','← Volver al repositorio');back.onclick=()=>{current=null;render()};root.append(back,el('p','eyebrow','Gestión local'),el('h2','','Sección privada'));const note=el('div','admin-note','Importante: en GitHub Pages la contraseña no ofrece seguridad real y los cambios se guardan solo en este navegador. Para publicar nuevos enlaces a todo el profesorado, exporta el archivo enlaces.json y actualiza los datos de index.html o utiliza una versión conectada a una base de datos.');root.append(note);const panel=el('section','panel');panel.append(el('h3','','Añadir un nuevo enlace'));const form=el('form','form-grid');form.id='addForm';form.innerHTML='<div class="field"><label for="newName">Nombre de la app</label><input id="newName" required maxlength="120" placeholder="Ej. Recursos de Matemáticas"></div><div class="field"><label for="newSection">Sección</label><select id="newSection" required></select></div><div class="field full"><label for="newUrl">Enlace web</label><input id="newUrl" type="url" required placeholder="https://..."></div><div class="field full"><button type="submit" class="button primary">+ Añadir enlace</button></div>';const select=form.querySelector('#newSection');sections.forEach(s=>{const o=el('option','',s.name);o.value=s.id;select.append(o)});form.onsubmit=e=>{e.preventDefault();const name=form.querySelector('#newName').value.trim(),url=form.querySelector('#newUrl').value.trim(),sec=sections.find(s=>s.id===select.value);if(!name||!/^https:\/\//i.test(url)||!sec){alert('Introduce un nombre y una URL HTTPS válida.');return}sec.links.push({id:'custom_'+Date.now()+'_'+Math.random().toString(36).slice(2),name,url});save();render();alert('Enlace añadido en este navegador. Exporta los cambios para conservar una copia.')};panel.append(form);root.append(panel);const manage=el('section','panel');manage.append(el('h3','','Enlaces del repositorio'));const list=el('div','manage-list');sections.forEach(sec=>{const h=el('h3','',sec.name);list.append(h);sec.links.forEach(l=>{const row=el('div','manage-row'),info=el('div');info.append(el('strong','',l.name),el('small','',l.url||'Sin URL'));const buttons=el('div','actions');buttons.style.marginTop='0';const edit=el('button','button','Editar'),del=el('button','button','Eliminar');edit.onclick=()=>{const name=prompt('Nombre del recurso:',l.name);if(name===null)return;const url=prompt('URL HTTPS (vacío si está pendiente):',l.url);if(url===null)return;if(!name.trim()||(url.trim()&&!/^https:\/\//i.test(url.trim()))){alert('Nombre o URL incorrectos');return}l.name=name.trim();l.url=url.trim();save();render()};del.onclick=()=>{if(confirm('¿Eliminar «'+l.name+'»?')){sec.links=sec.links.filter(x=>x.id!==l.id);save();render()}};buttons.append(edit,del);row.append(info,buttons);list.append(row)})});manage.append(list);root.append(manage);const tools=el('section','panel');tools.append(el('h3','','Copia de seguridad y publicación'));const actions=el('div','actions');const exportBtn=el('button','button gold','Exportar enlaces.json'),importBtn=el('button','button','Importar enlaces.json'),resetBtn=el('button','button','Restaurar catálogo inicial');exportBtn.onclick=()=>{const blob=new Blob([JSON.stringify(sections,null,2)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='JVS_enlaces.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};importBtn.onclick=()=>document.getElementById('importFile').click();resetBtn.onclick=()=>{if(confirm('¿Restaurar los enlaces originales? Se eliminarán los cambios locales.')){sections=ensureCanva(structuredClone(INITIAL));save();render()}};actions.append(exportBtn,importBtn,resetBtn);tools.append(actions,el('p','hint','El JSON exportado es una copia de los enlaces. No actualiza automáticamente la web publicada en GitHub.'));root.append(tools)}

document.getElementById('homeBtn').onclick=()=>{current=null;render()};document.getElementById('homeBrand').onclick=e=>{e.preventDefault();current=null;render()};document.getElementById('closeAuth').onclick=()=>document.getElementById('authModal').classList.add('hidden');document.getElementById('authForm').onsubmit=e=>{e.preventDefault();if(document.getElementById('password').value===PASSWORD){admin=true;current='admin';document.getElementById('authModal').classList.add('hidden');document.getElementById('password').value='';document.getElementById('authError').textContent='';render()}else document.getElementById('authError').textContent='Contraseña incorrecta'};
document.getElementById('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed)||!parsed.every(s=>typeof s.id==='string'&&typeof s.name==='string'&&Array.isArray(s.links)&&s.links.every(l=>typeof l.name==='string'&&typeof l.url==='string')))throw Error('Formato incorrecto');if(confirm('¿Sustituir todos los enlaces locales por los del archivo?')){sections=parsed;save();render()}}catch(err){alert('No se pudo importar el archivo: '+err.message)}e.target.value=''};
